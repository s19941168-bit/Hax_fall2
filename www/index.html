(function loop(n){requestAnimationFrame(loop);const raw=(n-last)/1000,dt=Math.min(.05,raw);last=n;FC++;adapt(raw);if(G){upd(dt);if(G.demo&&alive()<=2)start(true);R.render(sc,cam)}else if(SH&&shm){shT-=dt;if(shT<=0&&shd==null)shm.rotation.y+=dt*.9;const b=shm.userData.b=Math.max(0,shm.userData.b-dt*2.2),tm=performance.now();shm.position.y=Math.abs(Math.sin(tm/500))*.1+b*b*.6;shS.forEach(s=>{const u=s.userData;u.a+=dt*u.s;s.position.set(Math.cos(u.a)*u.r,(u.y+tm/1500*u.s)%4.5,Math.sin(u.a)*u.r)});R.render(sc,cam)}})(last);

const act_=()=>G&&!G.demo&&!G.over;
addEventListener("keydown",e=>{K[e.code]=1;if(!act_())return;if(e.code=="Space"){if(!e.repeat)P[0].jq=.15;e.preventDefault()}if(e.code=="KeyE")doPush(P[0])});addEventListener("keyup",e=>K[e.code]=0);
cv.addEventListener("contextmenu",e=>e.preventDefault());
$("jb").addEventListener("pointerdown",e=>{e.preventDefault();if(act_())P[0].jq=.15});
let jid=null,lid=null,jx0,jy0,lx0,ly0,sx0,sy0,st0;const joy=$("joy"),kn=$("knob");
cv.addEventListener("pointerdown",e=>{if(!act_())return;cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect(),lx=e.clientX-r.left;
if(e.pointerType=="touch"&&lx<r.width/2&&jid==null){jid=e.pointerId;jx0=e.clientX;jy0=e.clientY;joy.style.display="block";joy.style.left=lx+"px";joy.style.top=(e.clientY-r.top)+"px"}
else if(lid==null){lid=e.pointerId;lx0=sx0=e.clientX;ly0=sy0=e.clientY;st0=performance.now()}});
cv.addEventListener("pointermove",e=>{if(e.pointerId==jid){let dx=(e.clientX-jx0)/45,dy=(e.clientY-jy0)/45;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}jx=dx;jy=dy;kn.style.transform=`translate(${dx*30}px,${dy*30}px)`}
else if(e.pointerId==lid){pitch=Math.max(.15,Math.min(.8,pitch+(e.clientY-ly0)*.005));yaw-=(e.clientX-lx0)*.009;yawT=yaw;camHold=2.2;lx0=e.clientX;ly0=e.clientY}});
const up=e=>{if(e.pointerId==jid){jid=null;jx=jy=0;joy.style.display="none";kn.style.transform=""}
if(e.pointerId==lid){lid=null;if(e.pointerType=="touch"&&e.type=="pointerup"&&Math.hypot(e.clientX-sx0,e.clientY-sy0)<12&&performance.now()-st0<250&&act_())doPush(P[0])}};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);

let shd=null,shT=0;
cv.addEventListener("pointerdown",e=>{if(SH){shd=e.clientX;shT=1.5;cv.setPointerCapture(e.pointerId)}});
cv.addEventListener("pointermove",e=>{if(SH&&shd!=null&&shm){shm.rotation.y+=(e.clientX-shd)*.013;shd=e.clientX;shT=1.5}});
cv.addEventListener("pointerup",()=>{shd=null});
cv.addEventListener("wheel",e=>{if(SH&&shm){shm.scale.setScalar(Math.max(1,Math.min(2.4,shm.scale.x-e.deltaY*.002)));e.preventDefault()}},{passive:false});

(function(){const ld=$("load"),lt=$("lt"),bi=$("bi");let st=0;lt.textContent=t("tap");lt.className="blink";ld.style.cursor="pointer";
ld.onclick=()=>{if(st)return;st=1;ac();sfx("start");lt.className="";lt.textContent="0%";let pr=0,k=0;
const iv=setInterval(()=>{pr=Math.min(100,pr+5+Math.random()*3);bi.style.width=pr+"%";lt.textContent=Math.floor(pr)+"%";TKP=1+pr/100*.7;sfx("tick",k++%4==0?1:.75);
if(pr>=100){clearInterval(iv);TKP=1.5;setTimeout(()=>{sfx("ready");lt.textContent="✔"},170);setTimeout(()=>{ld.style.display="none";show("menu")},650)}},170)}})();
